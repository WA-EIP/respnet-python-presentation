<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$ class="quarto-title-block title-slide">

  <!-- Top 2/3 background image -->
  <div class="slide-background-content"></div>

  <!-- Bottom 1/3 row: logo + text -->
  <div class="bottom-row">
    <!-- Left column: logo -->
    <div class="left-col">
      $if(quarto-logo)$
      <img src="$quarto-logo$" alt="Logo" />
      $endif$
    </div>

    <!-- Right column: text -->
    <div class="right-col">
      <h1 class="title">$title$</h1>
      $if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
      $for(author)$<p class="author">$author$</p>$endfor$
      $for(institute)$<p class="institute">$institute$</p>$endfor$
      $if(date)$<p class="date">$date$</p>$endif$
    </div>
  </div>

</section>
